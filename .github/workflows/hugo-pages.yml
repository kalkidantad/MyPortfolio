name: Deploy Hugo academic portfolio

on:
  push:
    branches: [main, academic-portfolio/post-grad]
    paths:
      - 'recent_portfolio/**'
      - '.github/workflows/hugo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Build
        working-directory: recent_portfolio
        run: hugo --minify --baseURL "https://kalkidantad.github.io/MyPortfolio/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: recent_portfolio/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
